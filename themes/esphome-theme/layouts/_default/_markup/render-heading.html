<h{{ .Level }}  id="{{ .Anchor | safeURL }}">
    {{ .Text | safeHTML }}
    <span data-pagefind-ignore="all" class="copy-link dark-invert" data-anchor="{{ .Anchor }}" title="Copy link">
        <img alt="" aria-hidden="true" class="copy-link-icon" src="/images/icons/link.svg">
        <img alt="" aria-hidden="true" class="copy-link-check" src="/images/icons/check.svg">
    </span>
</h{{ .Level }}>
