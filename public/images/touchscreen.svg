<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Touchscreen icon</title>
  <desc>Abstract monochrome icon: a rounded rectangle screen with a single touch point and concentric ripple rings</desc>

  <rect fill="none" stroke="currentColor" x="230" y="140" width="220" height="320" rx="18" stroke-width="18" stroke-linejoin="round"/>

  <circle fill="none" stroke="currentColor" cx="340" cy="310" r="80" stroke-width="12" opacity="0.25"/>
  <circle fill="none" stroke="currentColor" cx="340" cy="310" r="52" stroke-width="12" opacity="0.5"/>
  <circle fill="none" stroke="currentColor" cx="340" cy="310" r="24" stroke-width="12" opacity="0.8"/>

  <circle fill="currentColor" cx="340" cy="310" r="10"/>

  <line stroke="currentColor" x1="390" y1="360" x2="450" y2="490" stroke-width="18" stroke-linecap="round"/>
</svg>
