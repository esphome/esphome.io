# Netlify configuration for Astro Starlight build

[build]
  publish = "dist"
  command = "npm ci && npm run migrate && npm run build"

[build.environment]
  NODE_VERSION = "20"
  # API docs URL is set per context below

[context.production]
  environment = { SITE_URL = "https://esphome.io", API_DOCS_URL = "https://api-docs.esphome.io" }

[context.beta]
  environment = { SITE_URL = "https://beta.esphome.io", API_DOCS_URL = "https://api-docs-beta.esphome.io", BRANCH = "beta" }

[context.next]
  environment = { SITE_URL = "https://next.esphome.io", API_DOCS_URL = "https://api-docs-dev.esphome.io", BRANCH = "next" }

# Caching HTML - 1 week
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Images, CSS, JS - 1 year, immutable (Astro uses content hashing)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.{png,jpg,jpeg,gif,webp,svg}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects from old paths
[[redirects]]
  from = "/_images/*"
  to = "/images/:splat"
  status = 301

[[redirects]]
  from = "/esphomeyaml/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/chat"
  to = "https://discord.gg/KhAMKrd"
  status = 301

# API docs redirect
[[redirects]]
  from = "/api/*"
  to = "https://api-docs.esphome.io/:splat"
  status = 301

# Webserver files
[[redirects]]
  from = "/_static/webserver-v1.*"
  to = "https://oi.esphome.io/v1/webserver-v1.:splat"
  status = 301

