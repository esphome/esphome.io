# FAQ entries for the ESPHome Starter Kit page.
#
# Loaded by the `faq` content collection (see src/content.config.ts).
# Each entry under `items` has:
#   title:   Question shown in the FAQ heading / <summary>.
#   content: Answer body. Markdown is supported (rendered to HTML at build time).
#            Use the "|" block scalar to preserve newlines and indentation.

items:
  - title: What is ESPHome?
    content: |
      [ESPHome](https://esphome.io/) is a free, open source platform that allows you to program small computer chips (called ESP
      microcontrollers) to create your own custom smart home devices. Configure them through a simple visual
      interface – no complex coding required – and run locally in your home, so none of your data is sent to
      external servers or the cloud.

  - title: What sets the ESPHome Starter Kit apart from other electronics kits?
    content: |
      The ESPHome Starter Kit is purpose-built for creating smart home devices, rather than general
      electronics. It's solder and sourcing-free, so you can focus entirely on building and learning rather
      than wrestling with components. Paired with the ESPHome Device Builder and a Learning Wiki, it gives
      you a direct entry into the wider ESPHome ecosystem and everything it has to offer. And unlike most
      learning kits, the modules don't end up in a drawer when you're done: they become real, working smart
      home devices you'll actually want to use and display in your home.

  - title: Is this kit suitable for complete beginners?
    content: |
      Absolutely. The ESPHome Starter Kit has been designed to remove the barriers that typically put
      beginners off: no soldering, component sourcing, or coding experience required. The kit contains
      everything you need for your first projects, with the step-by-step Wiki guiding you from scratch, so
      you can work at your own pace, dip in and out, and keep building your skills as your confidence grows.

  - title: From what age can you use the kit?
    content: |
      The ESPHome Starter Kit is suitable for teenagers and adults. While younger children may enjoy the
      hands-on assembly, the programming and configuration side requires a level of reading and technical
      comprehension that suits ages 13 and up. That said, it makes a great shared project for parents and
      children to tackle together.

  - title: What smart home platforms does the ESPHome Starter Kit work with?
    content: |
      Any smart home platform that supports ESPHome, including Home Assistant (see below). It also works as
      a completely standalone system over Wi-Fi: handy if you're not yet using a smart home platform, or
      want to try one out before committing.

  - title: Must I run Home Assistant to use this kit?
    content: |
      The ESPHome Desktop App runs as a free download on Mac, Windows, and Linux, so it's possible to build
      with the kit without installing [Home Assistant](https://www.home-assistant.io) or running a server:
      your devices will still work over Wi-Fi. That said, pairing the kit with Home Assistant unlocks the
      full potential of your devices, giving you powerful automation, dashboards, and control over your
      whole smart home from one central hub.

  - title: Can the kit run on battery power?
    content: |
      Yes. The main board is powered by USB-C, with support for an optional rechargeable LiPo battery
      (sold separately), so you can use it cable-free anywhere in your home if you need to.

  - title: Can I expand this kit with other sensors later on?
    content: |
      Yes, but you won't need to deal with messy wiring. The main compute board expands using the same flat
      ribbon cable system. Once you're ready to move past the starter kit modules, you can use the ribbon
      ports to plug in other compatible breakout boards and sensors directly. If you eventually want to
      design complex custom electronics with loose wires, the skills you learn here will translate to
      standard developer boards.

  - title: Can I ruin the hardware if I make a mistake?
    content: |
      No! A great thing about this setup is the code on the chips can be overwritten. If you write a broken
      configuration or something goes wrong, you can simply plug the board into your computer via USB and
      overwrite it with a fresh start.

  - title: What if I get stuck or have questions not covered here?
    content: |
      Don't worry, you're not building alone! The ESPHome community is incredibly active and welcoming. You
      can jump into our [Discord server](https://discord.gg/KhAMKrd) for real-time troubleshooting, browse
      the [forum](https://forum.apolloautomation.com/c/esphome-starter-kit/5)
      for detailed discussions, or dive into the
      [Learning Wiki](https://wiki.apolloautomation.com/products/ESPHome-Starter-Kit/start-here/) for
      step-by-step guides. No matter your skill level, there's always someone ready to help out.
