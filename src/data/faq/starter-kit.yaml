# FAQ entries for the ESPHome Starter Kit page.
#
# Loaded by the `faq` content collection (see src/content.config.ts).
# Each entry under `items` has:
#   title:   Question shown in the FAQ heading / <summary>.
#   content: Answer body. Markdown is supported (rendered to HTML at build time).
#            Use the "|" block scalar to preserve newlines and indentation.

items:
  - title: What is the ESPHome Starter Kit?
    content: |
      The **ESPHome Starter Kit** is the first official kit for learning to build your own smart home
      devices using [ESPHome](https://esphome.io). Designed and engineered by Apollo Automation in
      partnership with the [Open Home Foundation](https://www.openhomefoundation.org), it pairs the
      modern **ESP32-C6** chip with snap-together modules that connect with a single ribbon cable.
      No soldering, breadboards, parts sourcing, or code required.

  - title: Do I need to know how to code?
    content: |
      No. The kit is configured through **ESPHome Desktop**, a new free download for Mac, Windows, and
      Linux that handles every step through a simple visual interface. Users who want to learn YAML
      directly can do so at any time.

  - title: Do I need to solder anything?
    content: |
      No. Every connection in the kit is made with a single FPC ribbon cable. No breadboards, no jumper
      wires, no solder joints.

  - title: Does it require Home Assistant?
    content: |
      No. The new **ESPHome Desktop** app runs as a standalone download on Mac, Windows, and Linux, so
      users can build with the kit without installing [Home Assistant](https://www.home-assistant.io) or
      running a server first. The devices then work as standalone ESPHome devices over Wi-Fi, and
      integrate seamlessly with Home Assistant whenever the user wants to add it.

  - title: Can the kit run on battery power?
    content: |
      Yes. The main board is powered by USB-C, with support for an optional rechargeable LiPo battery
      (sold separately) so the kit can be deployed cable-free around the home.

  - title: What is the new ESPHome Desktop app?
    content: |
      ESPHome Desktop is the new free, open source desktop version of the ESPHome Device Builder. It runs
      on Mac, Windows, and Linux. For the first time, new users no longer need to install Home Assistant
      first, or set up a Raspberry Pi, or run a server to use ESPHome. Download it, plug in the kit, and
      a guided setup walks you through the rest. The latest release is available on GitHub.

  - title: What can I build with it?
    content: |
      By the end of the included learning path, users have built four working devices: a motion sensor, an
      environment monitor (temperature and humidity), a button trigger, and a notification light. Two
      modules can run on the main board at the same time, turning the kit into a multi-purpose sensor for
      any room. Beyond the lessons, every skill carries straight into the wider ESPHome ecosystem.

  - title: What happens when I'm "done" learning?
    content: |
      Every module is built to last and designed to keep working long after the lessons end. Unlike most
      learning kits, where the hardware ends up in a drawer, the ESPHome Starter Kit's modules become
      real, useful smart home devices that earn a permanent place in the home.

  - title: Does the kit support Zigbee?
    content: |
      The kit officially supports Wi-Fi, Bluetooth LE, and Thread. The ESP32-C6 chip inside also has
      Zigbee at the hardware level, so it is possible at the chip level for advanced users who want to
      experiment, though it is not part of the supported out-of-the-box experience.

  - title: Does it require a cloud service or account?
    content: |
      No. Everything runs **100% locally**. No cloud, no account, no subscription, no telemetry. Your
      data stays in your home, and what leaves it is only what you choose to share.

  - title: How does this connect to the Open Home Foundation?
    content: |
      Apollo Automation is a commercial partner of the [Open Home Foundation](https://www.openhomefoundation.org),
      the non-profit that owns and stewards [ESPHome](https://esphome.io),
      [Home Assistant](https://www.home-assistant.io), and over 250 other open source projects. The
      majority of profits from every ESPHome Starter Kit are contributed directly to the Open Home
      Foundation, funding the long-term development of the open source smart home and its founding
      principles of **privacy, choice, and sustainability**.

  - title: Was this announced before today?
    content: |
      Yes. Apollo Automation first previewed the ESPHome Starter Kit on stage at State of the Open Home
      2026 in Utrecht, where the Open Home Foundation highlighted it as an example of "building in the
      open" with partners. Today's launch is the kit's general availability.

  - title: What's the difference between this and other ESP starter kits?
    content: |
      Other kits typically focus on broad electronics learning with breadboards and individual components.
      The ESPHome Starter Kit is purpose-built for smart home device construction, uses a solder-free
      ribbon-cable system, and is paired with the new ESPHome Desktop app and a learning wiki that bridges
      into the wider ESPHome ecosystem. Most learning kits end with the lessons. The ESPHome Starter Kit's
      modules are designed to keep working as real smart home devices long after the kit is finished.

  - title: Why a ribbon cable instead of a breadboard?
    content: |
      Breadboards and jumper wires are the most common source of frustration for new builders: loose
      connections, wrong pins, wires that pop out. The ESPHome Starter Kit uses a single FPC (flexible
      printed circuit) ribbon cable that connects each module to the main board in seconds. Every
      connection is identical, foolproof, and reliable. Components snap together and stay together.

  - title: Why the ESP32-C6 chip?
    content: |
      The **ESP32-C6** is a modern microcontroller from Espressif that brings **Wi-Fi, Bluetooth LE, and
      Thread** support to a single chip. It is the same family of silicon used in commercially certified
      smart home products, and gives learners a future-ready platform that supports the same open
      standards used in production smart home devices.
